[project]
name = "qat"
version = "0.1.0"
description = "Quant Advisory Terminal - AI-assisted, human-in-the-loop share-trading advisory and paper-trading system"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PySide6>=6.7",
    "qasync>=0.27",
    "sqlmodel>=0.0.19",
    "keyring>=25.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "requests>=2.32",
    "tzdata>=2024.1",
    "hmmlearn>=0.3",
    "scikit-learn>=1.4",
    "ib_async>=2.0",
    "alpaca-py>=0.43",
    "anthropic>=0.119",
    "pyqtgraph>=0.13",
    # Real market data (M14). Free and unofficial: rate-limited, sparse on
    # quiet intervals, and not a contractual feed - see data/yfinance_source.py
    # for how each of those is handled rather than assumed away.
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "bandit>=1.7",
    "pre-commit>=3.7",
    "invoke>=2.2",
    "types-requests>=2.32",
    "pandas-stubs>=2.2",
    "pytest-cov>=5.0",
    "pyinstaller>=6.0",
    # scripts/build_manual.py regenerates the Word user manual from the running
    # widgets. A build-time tool, not a runtime one - the application itself
    # never writes .docx.
    "python-docx>=1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "qat.domain.*"
strict = true

[[tool.mypy.overrides]]
module = "qat.data.*"
strict = true

[[tool.mypy.overrides]]
module = "qasync"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hmmlearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyqtgraph"
ignore_missing_imports = true

# `yfinance` itself ships a py.typed marker; its internal `yfinance.data` does
# not. The poll's diagnostic reads YfData's cached cookie/crumb from there, and
# that is deliberately reaching into an unofficial internal - hence the narrow
# override rather than a blanket `yfinance.*`.
[[tool.mypy.overrides]]
module = "yfinance.data"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
qt_api = "pyside6"

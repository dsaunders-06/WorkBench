name: CI

on:
  push:
  pull_request:

jobs:
  lint-type-test:
    runs-on: windows-latest
    steps:
      # Node 24 majors. v4/v5 target Node 20, which GitHub deprecated and now
      # forces onto Node 24 with a warning on every run (seen 12 Sep 2026).
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy src

      - name: Security scan (bandit)
        run: bandit -q -r src

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
